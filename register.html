<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register</title>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

         <link rel="stylesheet" href="register.css">
        </head>

        <body>
            <div class="wrapper">
                <h1>Get Started:</h1>
                <p> Create your account & unlock smarter Store Management</p>
                <form action="/register" method="POST" onsubmit="return validateForm()">
                    
                    <div>
                        <span class="material-symbols-outlined">account_circle</span>                    
                        <input type="text" name="fullname" id="fullname-input" placeholder="Full Name" pattern="[A-Za-z]+( [A-Za-z]+){1,2}"  autocomplete="name" required>
                    </div>
                       
                    <div>
                        <span class="material-symbols-outlined">mail</span>
                        <input type="email" name="email" id="email-input" placeholder="Email"  autocomplete="email" required>   
                    </div>

                       <div>
                        <span class="material-symbols-outlined">call</span>                    
                        <input type="text" name="phone" id="phone-input" placeholder="Phone Number" pattern="[0-9]{10}" maxlength="10" inputmode="numeric"  autocomplete="tel" required>   
                    </div>

                       <div>
                        <span class="material-symbols-outlined">person</span>
                        <input type="text" name="username" id="username-input" placeholder="Username" autocomplete="username" required >
                    </div>

                    <div>
                    <span class="material-symbols-outlined">lock</span>                        
                    <input type="password" name="password" id="password-input" placeholder="Password" minlength="8"
                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$"
                title="Password must be at least 8 characters and contain uppercase, lowercase, number and special character."
                autocomplete="new-password"
                required>
                   </div>

                     <div>
                     <span class="material-symbols-outlined">pattern</span>
                     <input type="password" name="confirm_password" id="confirm-password-input" placeholder="Confirm Password"  minlength="8" autocomplete="new-password"required>
                     </div>

                    <div>
                        <span class="material-symbols-outlined">id_card</span>
                      <select name="role" id="role-input" required>
                          <option value="" disabled selected>Select Role</option>
                          <option value="admin">Admin</option>
                          <option value="manager">Manager</option>
                          <option value="supplier">Supplier</option>
                          </select>
                          </div>

                          <button type="submit">Register</button>

                          <p class="register-text"> if you have account? <a href="login.html">Login</a>
                           </p>
                          </form>
            </div>
            <script src="register.js"></script>
        </body>
        </html>
